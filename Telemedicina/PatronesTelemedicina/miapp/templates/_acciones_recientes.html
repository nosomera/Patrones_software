{% if acciones %}
<div class="card shadow-sm border-0 mb-4">
  <div class="card-body p-3">
    <h6 class="text-secondary fw-bold mb-2">Acciones recientes</h6>
    {% for r in acciones %}
      <div class="d-flex justify-content-between align-items-center py-2 {% if not forloop.last %}border-bottom{% endif %}">
        <div>
          <div>{{ r.descripcion }}</div>
          <small class="text-muted">Tiempo para deshacer: {{ r.minutos_restantes }} min</small>
        </div>
        <form method="post" action="{% url 'deshacer_accion' r.id %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-warning">Deshacer</button>
        </form>
      </div>
    {% endfor %}
  </div>
</div>
{% endif %}
